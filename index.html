<style>
/* Layout: one-hand sideline console. Sticky scoreboard on top, one view at a time, bottom tab bar. */
:root{

}

  --warn:#f0b429; --warn-soft:#3a2e0a; --danger:#ff6b5e; --danger-soft:#3d1714; --ok:#43c47a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --pitch:#0e5c3b; --pitch-2:#0b4f33; --line:rgba(255,255,255,.6);
  --bg:#0b1714; --surface:#12221d; --surface-2:#1a2f28; --ink:#e8f3ef; --muted:#93b0a8;
  --accent:#2fbf7a; --accent-ink:#04140d; --sky:#5bc2e7; --sky-soft:#12313d; --border:#24413a;

const ABBR = Object.fromEntries(Object.entries(POSN).map(([k,v])=>[v,k])); ABBR["Mediocampista"]="MED"; ABBR["Medio defensivo"]="MCD"; ABBR["Medio ofensivo"]="MCO";

function ab(pos){return ABBR[pos]||(pos?pos.slice(0,3).toUpperCase():"")}
function posLine(j){return j?ab(j.pos1):""}

function rivalInitials(name){const stop=new Set(["FC","F.C.","CD","C.D.","CLUB","DE","DEL","LA","LAS","LOS","EL","Y","FÚTBOL","FUTBOL","ESCUELA","DEPORTIVO","SUB"]);
  const w=String(name||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().split(/[\s\-.]+/).filter(x=>x&&!stop.has(x)&&!/^\d/.test(x));
  if(!w.length)return "R";if(w.length===1)return w[0].slice(0,2);return (w[0][0]+w[1][0])}
function rivalHue(name){let h=0;for(const ch of String(name||""))h=(h*31+ch.charCodeAt(0))>>>0;return h%360}
function rivalCrest(name,px){const t=rivalInitials(name),h=rivalHue(name);return `<svg class="crest" width="${px||30}" height="${Math.round((px||30)*46/40)}" viewBox="0 0 40 46" aria-hidden="true"><path d="${SHIELD}" fill="hsl(${h} 42% 36%)" stroke="#fff" stroke-width="2.2"/><path d="M4 17 H36" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/><text x="20" y="${t.length>1?32:33}" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, Arial, sans-serif" font-weight="800" font-size="${t.length>1?15:18}" fill="#fff">${esc(t)}</text></svg>`}
function drawRivalCrest(g,name,cx,cy,w){const t=rivalInitials(name),h=rivalHue(name);const sc=w/40;g.save();g.translate(cx-w/2,cy-23*sc);g.scale(sc,sc);const p=new Path2D(SHIELD);g.fillStyle=`hsl(${h} 42% 36%)`;g.fill(p);g.lineWidth=2.2;g.strokeStyle="#fff";g.stroke(p);g.strokeStyle="rgba(255,255,255,.35)";g.lineWidth=1.5;g.beginPath();g.moveTo(4,17);g.lineTo(36,17);g.stroke();g.fillStyle="#fff";g.textAlign="center";g.font=`800 ${t.length>1?15:18}px "Barlow Condensed", "Arial Narrow", Arial, sans-serif`;g.fillText(t,20,t.length>1?32:33);g.restore()}

/* ============ Reloj ============ */
function dur(){return Number(S.match?.duracion)||80}
function half(){return dur()/2}
function clockState(){
  const r=S.match?.reloj||{};const now=Date.now();
  if(r.fin2){const em=endMin();const ep=S.match?.estadoPartido;return {per:3,min:em,secs:em*60,label:ep&&ep.estado!=="Finalizado"?ep.estado:"Final"}}
  if(r.inicio2){const s=Math.max(0,Math.floor((now-r.inicio2)/1000));return {per:2,min:half()+Math.floor(s/60)+1,secs:half()*60+s,label:"2.º tiempo"+(s>half()*60?" · +"+Math.ceil((s-half()*60)/60)+"'":""),over:s>half()*60}}
  if(r.fin1) return {per:1.5,min:half(),secs:half()*60,label:"Entretiempo"};
  if(r.inicio1){const s=Math.max(0,Math.floor((now-r.inicio1)/1000));return {per:1,min:Math.floor(s/60)+1,secs:s,label:"1.er tiempo"+(s>half()*60?" · +"+Math.ceil((s-half()*60)/60)+"'":""),over:s>half()*60}}
  return {per:0,min:0,secs:0,label:"Sin iniciar"};
}
function clockText(){const c=clockState();return pad2(Math.floor(c.secs/60))+":"+pad2(c.secs%60)}
function curPeriod(){const c=clockState();return c.per>=2?2:1}
function curMinute(){const c=clockState();return c.per===0?1:c.min}

/* ============ Eventos y estadísticas ============ */
function allEvents(){
  const map=new Map();S.events.forEach(e=>map.set(e.id,e));
  S.queue.filter(q=>q.mid===S.mid).forEach(q=>{const prev=map.get(q.id);map.set(q.id,Object.assign({},prev||{},q.data,{_pend:true}))});
  return [...map.values()].sort((a,b)=>(a.periodo-b.periodo)||(a.minuto-b.minuto)||(a.ts-b.ts));
}
function activeEvents(){return allEvents().filter(e=>!e.anulado)}
function endMin(){const ep=S.match?.estadoPartido;return ep&&ep.estado!=="Finalizado"&&ep.minuto?Math.min(Number(ep.minuto),dur()):dur()}
function estadoTxt(m){const ep=m?.estadoPartido;if(!ep||ep.estado==="Finalizado")return m?.reloj?.fin2?"Finalizado":(m?.reloj?.inicio1?"En juego":"Por jugar");return ep.estado+" en el min. "+ep.minuto+(ep.motivo?" por "+ep.motivo.toLowerCase():"")+(ep.nota?" ("+ep.nota+")":"")}
function capMin(e){const h=half(),D=endMin();return e.periodo===1?Math.min(e.minuto,h):Math.max(h,Math.min(e.minuto,D))}

function computeState(evs){
  const m=S.match;if(!m)return null;
  const forms=formsAll();
  let formacion=m.formacion, coords=m.coords||forms[formacion]||BASE_FORMS["4-4-2"];
  let slots=(m.titulares||[]).slice();
  const st={};const ensure=id=>st[id]||(st[id]={tramos:[],open:null,goles:0,asist:0,am:0,ro:0,gr:0,pen:0,lesion:false,notas:[]});
  slots.forEach(id=>{if(id){ensure(id).open=0}});
  let gf=0,gc=0;const timeline=[];
  const gkNow=()=>{const i=coords.findIndex(c=>c[0]==="POR");return i>=0?slots[i]:null};
  for(const e of evs){
    const t=capMin(e);
    if(e.tipo==="gol"){gf++;if(e.jugador)ensure(e.jugador).goles++;if(e.rel)ensure(e.rel).asist++}
    else if(e.tipo==="gol_rival"){gc++;const g=gkNow();if(g)ensure(g).gr++}
    else if(e.tipo==="amarilla"){if(e.jugador)ensure(e.jugador).am++}
    else if(e.tipo==="roja"){if(e.jugador){const s=ensure(e.jugador);s.ro++;if(s.open!==null){s.tramos.push([s.open,t]);s.open=null}const i=slots.indexOf(e.jugador);if(i>=0)slots[i]=null}}
    else if(e.tipo==="cambio"){
      const out=e.jugador,inn=e.rel;
      if(out){const s=ensure(out);if(s.open!==null){s.tramos.push([s.open,t]);s.open=null}}
      if(inn){const s=ensure(inn);if(s.open===null)s.open=t}
      const i=slots.indexOf(out);if(i>=0)slots[i]=inn||null;else if(inn){const k=slots.indexOf(null);if(k>=0)slots[k]=inn}
    }
    else if(e.tipo==="penal_atajado"){const g=e.jugador||gkNow();if(g)ensure(g).pen++}
    else if(e.tipo==="lesion"){if(e.jugador)ensure(e.jugador).lesion=true}
    else if(e.tipo==="formacion"){if(e.formacion){formacion=e.formacion;coords=e.coords||forms[e.formacion]||coords}if(Array.isArray(e.slots))slots=e.slots.slice()}
    if(e.tipo==="nota"&&e.jugador)ensure(e.jugador).notas.push(e.detalle||"");
    timeline.push({e,gf,gc});
  }
  return {formacion,coords,slots,st,gf,gc,timeline};
}

function finalStats(){
  const evs=activeEvents();const cs=computeState(evs);if(!cs)return null;
  const D=endMin();const rows=[];
  const tit=new Set((S.match.titulares||[]).filter(Boolean));
  for(const id of (S.match.convocados||[])){
    const s=cs.st[id]||{tramos:[],open:null,goles:0,asist:0,am:0,ro:0,gr:0,pen:0,notas:[]};
    const tr=s.tramos.slice();if(s.open!==null)tr.push([s.open,D]);
    const mins=tr.reduce((a,[i,o])=>a+Math.max(0,o-i),0);
    let cond=tit.has(id)?"Titular":(tr.length?"Suplente":"Convocado sin jugar");
    let entra="",sale="";
    if(tr.length){entra=cond==="Titular"?"":tr[0][0];const last=tr[tr.length-1][1];sale=last<D?last:""}
    let obs=[];if(tr.length>1)obs.push("Reingreso: "+mins+" min reales en "+tr.length+" tramos");
    if(s.notas?.length)obs.push(s.notas.join(" · "));
    rows.push({id,cond,entra,sale,mins,goles:s.goles,asist:s.asist,am:s.am,ro:s.ro,gr:s.gr,pen:s.pen,lesion:s.lesion,obs:obs.join(" | ")});
  }
  const order={Titular:0,Suplente:1,"Convocado sin jugar":2};
  rows.sort((a,b)=>order[a.cond]-order[b.cond]);
  return {rows,gf:cs.gf,gc:cs.gc,cs};
}

function cacheLocal(){LS.set("cache",{roster:S.roster,fotos:S.fotos,forms:S.forms,estado:S.estado,mid:S.mid,match:S.match,events:S.events,staff:S.staff,marca:S.marca,hoja:S.hoja})}
function loadLocal(){const c=LS.get("cache",null);if(c){Object.assign(S,{roster:c.roster||null,fotos:c.fotos||{},forms:c.forms||{},estado:c.estado||{actual:null},mid:c.mid||null,match:c.match||null,events:c.events||[],staff:c.staff||null,marca:c.marca||{},hoja:c.hoja||{test:false,testId:""}})}S.queue=LS.get("queue",[]);S.draft=LS.get("draft",null)}
function saveQueue(){LS.set("queue",S.queue)}
function saveDraft(){LS.set("draft",S.draft)}

async function writeDoc(path,data,merge){
  if(!S.db)return;
  const ref=S.db.doc(path);
  if(merge){try{await ref.update(data)}catch(e){if(e&&e.code==="invalid_argument")await ref.set(data);else throw e}}
  else await ref.set(data);
}

function addEvent(data){
  if(!S.mid){toast("Primero crea el partido en la pestaña Partido.");return}
  const id=newId("e");
  const ev=Object.assign({id,ts:Date.now(),autor:S.uid||"local",anulado:false},data);
  S.queue.push({id,mid:S.mid,data:ev});saveQueue();buzz();render();flushQueue();
  return ev;
}
function annulEvent(id,val=true){
  const q=S.queue.find(x=>x.id===id&&x.mid===S.mid);
  const base=allEvents().find(e=>e.id===id);if(!base)return;
  const data=Object.assign({},base,{anulado:val});delete data._pend;
  if(q)q.data=data;else S.queue.push({id,mid:S.mid,data});
  saveQueue();render();flushQueue();
}
let flushing=false;
async function flushQueue(){
  if(flushing||!S.db||!S.queue.length)return;flushing=true;
  try{
    for(const q of S.queue.slice()){
      try{await S.db.doc("partidos/"+q.mid+"/eventos/"+q.id).set(q.data);S.queue=S.queue.filter(x=>x!==q);saveQueue()}
      catch(e){if(e&&(e.code==="invalid_argument")){S.canWrite=false;toast("Tu acceso no permite anotar en este partido.");break}break}
    }
  }finally{flushing=false;renderBoard()}
}
window.addEventListener("online",()=>{S.online=true;flushQueue();renderBoard()});
window.addEventListener("offline",()=>{S.online=false;renderBoard()});
setInterval(()=>{if(S.queue.length)flushQueue()},15000);

function subscribeMatch(mid){
  if(unsub.match){unsub.match();unsub.match=null}
  if(unsub.events){unsub.events();unsub.events=null}
  S.mid=mid;
  if(!mid){S.match=null;S.events=[];render();return}
  if(!S.db){render();return}
  unsub.match=S.db.doc("partidos/"+mid).onSnapshot(s=>{if(s.exists){const nd=cl(s.data());if(S.match&&Date.now()-(S._typing||0)<2500){nd.cierre=S.match.cierre;nd.notas=S.match.notas}S.match=nd;cacheLocal();render()}},()=>{});
  unsub.events=S.db.collection("partidos/"+mid+"/eventos").onSnapshot(q=>{
    S.events=q.docs.map(d=>cl(d.data()));
    S.queue=S.queue.filter(x=>{const srv=S.events.find(e=>e.id===x.id);return !(srv&&srv.anulado===x.data.anulado&&srv.minuto===x.data.minuto)});
    saveQueue();cacheLocal();render();
  },()=>{});
}

async function setMatch(patch){
  S.match=Object.assign({},S.match||{},patch);cacheLocal();render();
  if(!S.db)return;
  const ref=S.db.doc("partidos/"+S.mid);
  try{await ref.update(patch)}catch(e){
    try{if(e&&e.code==="invalid_argument")await ref.set(S.match);else throw e}catch(e2){toast("Guardado en este teléfono; se enviará al recuperar señal.")}
  }
}

function sheetId(){return S.hoja?.test&&S.hoja.testId?S.hoja.testId:SHEET_ID}
async function gs(tool,input){
  if(!S.mcp)throw {code:"not_granted",message:"Conector no disponible"};
  const r=await S.mcp.callTool(GS,tool,Object.assign({spreadsheetId:sheetId()},input),{cache:false});
  return r.payload;
}
function gsErrorText(e){
  const c=e&&e.code;
  if(c==="needs_reauth")return "Tu conexión con Google Sheets venció. Reconéctala en claude.ai → Configuración → Conectores y vuelve a intentar.";
  if(c==="server_not_connected"||c==="selection_required")return "Esta app necesita tu conector de Google Sheets. Agrégalo en claude.ai → Configuración → Conectores.";
  if(c==="not_in_manifest"||c==="approval_required")return "No se permitió el acceso a Google Sheets. Vuelve a tocar el botón y acepta el permiso.";
  if(c==="not_granted"||c==="capability_disabled")return "Esta vista no puede usar Google Sheets. Ábrela desde claude.ai con tu cuenta.";
  if(c==="server_unavailable")return "Google Sheets no respondió. Revisa la señal e inténtalo de nuevo.";
  return "Error de Google Sheets: "+((e&&e.message)||"sin detalle");
}
async function readRange(range){const p=await gs("get_values",{range});return (p&&p.values)||[]}

async function loadRosterFromSheet(){

    readRange("Plantilla!A2:C41"),readRange("Plantilla!J2:K41"),readRange("Plantilla!P2:Q41"),readRange("Plantilla!X2:X41"),
    readRange("Listas!N2:N30"),readRange("Config!A29:B40"),readRange("Convocatoria!A5:O44").catch(()=>[])
  ]);
  const jug=[];
  a.forEach((r,i)=>{if(!r||!r[0]||!r[1])return;const lab=r[1];jug.push({id:r[0],nombre:lab.replace(/^P\d+\s*·\s*/,""),dorsal:r[2]||"",pos1:(b[i]||[])[0]||"",pos2:(b[i]||[])[1]||"",estado:(c[i]||[])[0]||"",disp:(c[i]||[])[1]||"Disponible",grupo:(d[i]||[])[0]||"A"})});
  (cv||[]).forEach(row=>{const j=jug.find(x=>x.id===row[0]);if(j){j.puntaje=row[12]||"";j.ranking=row[13]||"";j.sugerencia=row[14]||""}});

  S.roster={jugadores:jug,comps:Object.keys(comps).length?comps:COMPS_DEFAULT,zonas:zonas.length?zonas:ZONAS_DEFAULT,duracion,actualizado:Date.now()};
  cacheLocal();

function themeIcon(){const t=LS.get("theme","auto");return t==="dark"?"☾":t==="light"?"☀":"◐"}
function applyTheme(){const t=LS.get("theme","auto");const el=document.documentElement;if(t==="auto")el.removeAttribute("data-theme");else el.setAttribute("data-theme",t)}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms||35)}catch(e){}}
function nowMin(){const c=clockState();if(c.per===0)return 0;if(c.per>=3)return endMin();const m=Math.floor(c.secs/60);return c.per<2?Math.min(m,half()):Math.min(m,dur())}
function liveMins(st,id){const s=st.st[id];if(!s)return 0;let t=s.tramos.reduce((a,[i,o])=>a+Math.max(0,o-i),0);if(s.open!==null)t+=Math.max(0,nowMin()-s.open);return t}
function checklist(d){
  const js=S.roster?.jugadores||[];const conv=d.convocados;
  const fresh=S.roster?.actualizado&&(Date.now()-S.roster.actualizado<36*3600*1000);
  const sinDorsal=conv.filter(id=>!player(id)?.dorsal).length;
  const sinFoto=conv.filter(id=>!S.fotos[id]).length;
  const llenos=d.slots.filter(Boolean).length;
  const items=[
   [fresh,fresh?"Plantilla actualizada (lesiones y sanciones al día)":"Recarga la plantilla para tomar lesiones y sanciones recientes"],
   [!!d.rival.trim(),d.rival.trim()?"Rival: "+d.rival:"Falta el nombre del rival"],
   [conv.length>0&&(!d.cupo||conv.length<=d.cupo),conv.length?`${conv.length} convocados${d.cupo?" de "+d.cupo:""}`:"Aún no hay convocados"],
   [llenos===d.slots.length,`Alineación: ${llenos} de ${d.slots.length} posiciones`],
   [conv.length>0&&sinDorsal===0,sinDorsal?`${sinDorsal} convocado(s) sin dorsal (Ajustes)`:"Dorsales completos"],
   [conv.length>0&&sinFoto===0,sinFoto?`${sinFoto} convocado(s) sin foto (opcional)`:"Fotos completas"],
   [!S.hoja?.test,S.hoja?.test?"Estás usando la hoja de pruebas":"Escribirá en tu hoja real"]
  ];
  const ok=items.filter(i=>i[0]).length;
  return `<section class="sec"><div class="row" style="justify-content:space-between"><h2>Antes del partido</h2><span class="pill" style="background:var(--surface-2)">${ok} / ${items.length}</span></div><ul class="chk">${items.map(([g,t])=>`<li class="${g?"ok":"no"}"><span class="i">${g?"✓":"!"}</span><span>${esc(t)}</span></li>`).join("")}</ul></section>`;
}

/* ============ Vista: Partido (DT) ============ */
function ensureDraft(){
  if(S.draft)return S.draft;
  const m=S.match;
  S.draft=m&&!m.reloj?.inicio1?{fecha:m.fecha,comp:m.competicion,rival:m.rival,loc:m.localia,micro:m.micro,dur:m.duracion,cupo:m.cupo,ptId:m.ptId||null,row:m.sheetRow||null,convocados:(m.convocados||[]).slice(),formacion:m.formacion,coords:m.coords||null,slots:(m.titulares||[]).slice(),editing:S.mid}
   :{fecha:todayStr(),comp:"Liga Departamental",rival:"",loc:"Local",micro:"",dur:S.roster?.duracion||80,cupo:null,ptId:null,row:null,convocados:[],formacion:"4-4-2",coords:null,slots:Array(11).fill(null),editing:null};
  if(S.draft.cupo==null)S.draft.cupo=cupoFor(S.draft.comp);
  return S.draft;
}
function cupoFor(comp){const c=(S.roster?.comps||COMPS_DEFAULT);return comp in c?c[comp]:null}
function draftCoords(d){return d.coords||formsAll()[d.formacion]||BASE_FORMS["4-4-2"]}

function pitchHtml(coords,slots,opt){
  const lines=`<span class="ln" style="inset:3% 4%"></span><span class="ln" style="left:4%;right:4%;top:50%;height:0;border-width:2px 0 0"></span>
   <span class="ln" style="left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)"></span>
   <span class="ln" style="left:24%;right:24%;top:3%;height:14%;border-top:0"></span><span class="ln" style="left:24%;right:24%;bottom:3%;height:14%;border-bottom:0"></span>
   <span class="ln" style="left:38%;right:38%;bottom:3%;height:5%;border-bottom:0"></span><span class="ln" style="left:38%;right:38%;top:3%;height:5%;border-top:0"></span>`;
  const st=opt.state;
  const toks=coords.map((c,i)=>{const id=slots[i];const p=id?player(id):null;
    let cards="";if(st&&id&&st.st[id]){const s=st.st[id];cards=`<span class="cards">${s.am?'<i class="card-y"></i>':""}${s.am>1||s.ro?'<i class="card-r"></i>':""}</span>`}
    const act=opt.mode==="setup"?"slot":"onfield";
    return `<button class="tok" data-act="${act}" data-i="${i}" data-id="${id||""}" style="left:${c[1]}%;top:${c[2]}%">${cards}${st&&id?`<span class="mins">${liveMins(st,id)}'</span>`:""}${id?avatar(id):`<span class="av empty">+</span>`}<span class="lb">${p?(p.dorsal?esc(p.dorsal)+" · ":"")+esc(shortName(id)):'<span class="code">'+esc(c[0])+"</span>"}</span></button>`}).join("");
  return `<div class="pitch" id="pitch">${lines}${toks}</div>`;
}

function bindPitchDrag(){
  const pitch=$("#pitch");if(!pitch||!S.dragMode)return;
  let drag=null;
  pitch.addEventListener("pointerdown",ev=>{const t=ev.target.closest(".tok");if(!t)return;ev.preventDefault();drag={el:t,i:Number(t.dataset.i)};t.classList.add("drag");t.setPointerCapture(ev.pointerId)});
  pitch.addEventListener("pointermove",ev=>{if(!drag)return;const r=pitch.getBoundingClientRect();const x=Math.max(6,Math.min(94,(ev.clientX-r.left)/r.width*100));const y=Math.max(6,Math.min(94,(ev.clientY-r.top)/r.height*100));drag.el.style.left=x+"%";drag.el.style.top=y+"%";drag.x=x;drag.y=y});
  const end=()=>{if(!drag)return;const d=S.draft;if(drag.x!=null){const c=draftCoords(d).map(a=>a.slice());c[drag.i][1]=Math.round(drag.x);c[drag.i][2]=Math.round(drag.y);d.coords=c;saveDraft()}drag.el.classList.remove("drag");drag=null};
  pitch.addEventListener("pointerup",end);pitch.addEventListener("pointercancel",end);
}

function candidatesFor(code,pool){
  const pos=POSN[code];
  const rank=j=>{let r=j.pos1===pos?0:(j.pos2===pos?1:2);if(j.disp&&j.disp!=="Disponible")r+=3;return r};
  return pool.map(id=>player(id)).filter(Boolean).sort((a,b)=>rank(a)-rank(b)||a.nombre.localeCompare(b.nombre));
}
function openSlotPicker(i){
  const d=S.draft;const code=draftCoords(d)[i][0];
  const pool=d.convocados.length?d.convocados:S.roster.jugadores.map(j=>j.id);
  const list=candidatesFor(code,pool);const pos=POSN[code];
  sheet(`<h3>${esc(pos)} (${esc(code)})</h3>
   <div class="plist">${list.map(j=>{const tag=j.pos1===pos?"Principal":(j.pos2===pos?"Alternativa":"");const inSlot=d.slots.indexOf(j.id);
    return `<button class="prow ${d.slots[i]===j.id?"on":""}" data-act="pickSlot" data-i="${i}" data-id="${j.id}">${avatar(j.id)}<span class="meta"><span class="nm">${esc(j.nombre)}</span><span class="ps"><span class="ab">${esc(posLine(j))}</span>${tag?" · "+tag:""}${inSlot>=0&&inSlot!==i?" · ya está en la cancha":""}</span></span>${dispChip(j)}</button>`}).join("")}</div>
   <div class="row"><button class="btn wide" data-act="pickSlot" data-i="${i}" data-id="">Dejar vacía</button><button class="btn wide" data-act="close">Cancelar</button></div>`);
}

async function saveMatch(){
  const d=S.draft;
  if(!d.rival.trim()){toast("Escribe el nombre del rival.");return}
  const titulares=d.slots.slice();
  const conv=d.convocados.slice();titulares.forEach(id=>{if(id&&!conv.includes(id))conv.push(id)});
  const data={fecha:d.fecha,competicion:d.comp,rival:d.rival.trim(),localia:d.loc,micro:d.micro,duracion:Number(d.dur)||80,cupo:d.cupo?Number(d.cupo):null,
    ptId:d.ptId||null,sheetRow:d.row||null,convocados:conv,titulares,formacion:d.formacion,coords:d.coords||null,clima:d.clima||"",temp:d.temp===""?"":Number(d.temp)||d.temp,maxCambios:d.maxCambios??null,reingreso:!!d.reingreso,jornada:d.jornada||"",hora:d.hora||"",lugar:d.lugar||"",staff:d.staff||defaultStaff()};
  let mid=d.editing;
  if(!mid){mid=newId("m");Object.assign(data,{reloj:{},mvp:null,notas:"",sync:{},creado:Date.now()})}
  S.mid=mid;S.match=Object.assign({},mid===d.editing?S.match:{},data);
  if(!d.editing){S.events=[]}
  S.draft=null;saveDraft();cacheLocal();
  try{
    await writeDoc("partidos/"+mid,S.match);
    S.estado={actual:mid};await writeDoc("config/estado",S.estado);
  }catch(e){toast("Guardado en este teléfono; se enviará al recuperar señal.")}
  subscribeMatch(mid);S.view="vivo";render();toast("Partido listo.");
}

/* ============ Vista: En vivo ============ */
function viewVivo(){
  if(!S.match)return `<section class="sec empty-state"><h2>Sin partido activo</h2><p class="hint">${S.isOwner?"Arma la convocatoria y la alineación en la pestaña Partido.":"Cuando el DT active el partido, aparecerá aquí."}</p>${S.isOwner?'<button class="btn pri" data-act="tab" data-v="partido">Ir a Partido</button>':""}</section>`;
  const st=computeState(activeEvents());const c=clockState();

  else if(!r.fin1)ctl=`<button class="btn wide" data-act="clock" data-k="fin1">Fin del 1.er tiempo</button>`;
  else if(!r.inicio2)ctl=`<button class="btn pri wide" data-act="clock" data-k="inicio2">Iniciar 2.º tiempo</button>`;
  else if(!r.fin2)ctl=`<button class="btn wide" data-act="clock" data-k="fin2">Final del partido</button>`;
  else ctl=S.isOwner?`<button class="btn sky wide" data-act="tab" data-v="cierre">Ir al cierre</button>`:"";
  const onField=new Set(st.slots.filter(Boolean));
  const out=new Set(Object.entries(st.st).filter(([id,s])=>s.open===null&&(s.tramos.length||s.ro)).map(([id])=>id));
  const bench=(S.match.convocados||[]).filter(id=>!onField.has(id));
  const evs=allEvents().slice().reverse();
  const sinJugar=c.per>=1.5&&c.per<3?(S.match.convocados||[]).filter(id=>liveMins(st,id)===0&&!onField.has(id)&&!(st.st[id]?.ro)):[];
  return `${sinJugar.length?`<div class="banner warn"><strong>Aún no han jugado:</strong> ${sinJugar.map(id=>esc(shortName(id))).join(", ")}</div>`:""}<section class="sec"><div class="clock ${c.over?"over":""}"><span class="t num" data-clock>${clockText()}</span><span class="p" data-clocklabel>${esc(c.label)} · ${esc(S.match.duracion||80)}'</span></div>
    ${ctl}${r.inicio1&&!r.fin2?`<div class="row"><button class="btn sm" data-act="clockFix">Corregir reloj</button><button class="btn sm" data-act="estadoSheet">Suspender partido</button></div>`:""}${r.fin2&&S.match.estadoPartido&&S.match.estadoPartido.estado!=="Finalizado"?`<div class="banner warn">${esc(estadoTxt(S.match))}</div>`:""}</section>
   <section class="sec"><div class="row" style="justify-content:space-between"><h3>En cancha · ${esc(st.formacion||"")}</h3><span class="hint">Toca un jugador</span></div>
    ${pitchHtml(st.coords,st.slots,{mode:"live",state:st})}
    <div class="quick"><button class="btn dan" data-act="golRival">Gol rival</button><button class="btn" data-act="noteFree">Nota</button><button class="btn" data-act="formChange">Formación</button><button class="btn" data-act="ctCard">Tarjeta cuerpo técnico</button></div><button class="btn wide" data-act="undoLast">Deshacer último evento</button></section>
   <section class="sec"><div class="row" style="justify-content:space-between"><h3>Banco</h3><span class="pill num" style="background:${cambiosAgotados()?"var(--danger)":"var(--surface-2)"};color:${cambiosAgotados()?"#fff":"var(--ink)"}">Cambios ${nCambios()}${S.match.maxCambios?" / "+S.match.maxCambios:""}</span></div><div class="bench">${bench.length?bench.map(id=>`<button data-act="benchP" data-id="${id}" class="${out.has(id)?"out":""}">${avatar(id)}<span class="lb">${esc(shortName(id))}</span><span class="mn">${liveMins(st,id)}'</span></button>`).join(""):'<span class="hint">Sin suplentes.</span>'}</div></section>

function evIcon(e){return {gol:"⚽",gol_rival:"⚽",amarilla:'<i class="card-y"></i>',roja:'<i class="card-r"></i>',cambio:"⇄",penal_atajado:"🧤",lesion:"✚",formacion:"▦",nota:"✎",amon_ct:e.color==="roja"?'<i class="card-r"></i>':'<i class="card-y"></i>'}[e.tipo]||"·"}
function evText(e){
  const n=id=>id?esc(shortName(id)):"";
  switch(e.tipo){
    case "gol":return `Gol de ${e.jugador?n(e.jugador):"autogol del rival"}${e.rel?`<small>Asistencia: ${n(e.rel)}</small>`:""}`;
    case "gol_rival":return `Gol de ${esc(S.match?.rival||"rival")}${e.detalle?`<small>${esc(e.detalle)}</small>`:""}`;
    case "amarilla":return `Amarilla a ${n(e.jugador)}`;
    case "roja":return `Roja a ${n(e.jugador)}${e.detalle?`<small>${esc(e.detalle)}</small>`:""}`;
    case "cambio":return `Entra ${n(e.rel)}<small>Sale ${n(e.jugador)}</small>`;
    case "penal_atajado":return `Penal atajado por ${n(e.jugador)}`;
    case "lesion":return `Lesión de ${n(e.jugador)}<small>${esc(e.detalle||"")}</small>`;
    case "formacion":return `Cambio a ${esc(e.formacion||"")}`;
    case "nota":return `${e.jugador?n(e.jugador)+": ":""}${esc(e.detalle||"")}`;
    case "amon_ct":return `${e.color==="roja"?"Roja":"Amarilla"} a ${esc(e.detalle||"cuerpo técnico")}<small>Cuerpo técnico</small>`;
  }
  return esc(e.tipo);
}
function evRow(e){
  const mine=S.isOwner||e.autor===S.uid;
  return `<li class="${e.anulado?"x":""} ${e._pend?"pend":""}"><span class="m">${esc(e.minuto)}'</span><span class="ico">${evIcon(e)}</span><span class="d">${evText(e)}</span>${mine?`<button class="btn sm" data-act="${e.anulado?"restore":"undo"}" data-id="${e.id}">${e.anulado?"Restaurar":"Deshacer"}</button>`:""}</li>`;

function minInput(){return `<div class="minbox"><span class="hint">Minuto</span><button class="btn" data-act="minStep" data-d="-1" type="button">−</button><input id="evMin" inputmode="numeric" value="${curMinute()}"><button class="btn" data-act="minStep" data-d="1" type="button">+</button></div>`}
function readMin(){const v=parseInt($("#evMin")?.value,10);return isFinite(v)&&v>0?v:curMinute()}

function sinTope(){return S.match?.reingreso!=null?!!S.match.reingreso:!S.match?.cupo}
function nCambios(){return activeEvents().filter(e=>e.tipo==="cambio").length}
function cambiosAgotados(){const mx=S.match?.maxCambios;return mx&&nCambios()>=mx}
function handleEv(t){
  const id=pending?.id;const minuto=readMin();const periodo=curPeriod();
  const st=computeState(activeEvents());
  const onF=st.slots.filter(Boolean);
  const used=new Set(Object.entries(st.st).filter(([k,s])=>s.tramos.length||s.ro).map(([k])=>k));
  const benchAvail=(S.match.convocados||[]).filter(x=>!onF.includes(x)&&(sinTope()||!used.has(x))&&!(st.st[x]?.ro));
  if(t==="gol"){
    pending={id,minuto,periodo};
    sheet(`<h3>¿Quién dio la asistencia?</h3><div class="plist">${onF.filter(x=>x!==id).map(x=>`<button class="prow" data-act="assist" data-id="${x}">${avatar(x)}<span class="meta"><span class="nm">${esc(shortName(x))}</span></span></button>`).join("")}</div>
     <button class="btn wide pri" data-act="assist" data-id="">Sin asistencia</button>`);return;
  }
  if((t==="cambio"||t==="entra")&&cambiosAgotados()){sheet(`<h3>Cambios agotados</h3><p class="hint">Ya se hicieron los ${S.match.maxCambios} cambios permitidos en ${esc(S.match.competicion||"esta competición")}. Si fue un error de registro, deshaz un cambio en la lista de eventos o ajusta el máximo en la pestaña Partido.</p><button class="btn wide" data-act="close">Entendido</button>`);return}
  if(t==="entra"&&!sinTope()&&used.has(id)){sheet(`<h3>Sin reingreso</h3><p class="hint">${esc(shortName(id))} ya salió del partido y en ${esc(S.match.competicion||"esta competición")} no se permite el reingreso.</p><button class="btn wide" data-act="close">Entendido</button>`);return}
  if(t==="cambio"){
    pending={id,minuto,periodo};
    sheet(`<h3>Entra por ${esc(shortName(id))}</h3><div class="plist">${benchAvail.map(x=>`<button class="prow" data-act="subIn" data-id="${x}">${avatar(x)}<span class="meta"><span class="nm">${esc(shortName(x))}</span><span class="ps"><span class="ab">${esc(posLine(player(x)))}</span></span></span>${dispChip(player(x))}</button>`).join("")||'<p class="hint">No hay suplentes disponibles.</p>'}</div><button class="btn wide" data-act="close">Cancelar</button>`);return;
  }
  if(t==="entra"){
    pending={id,minuto,periodo};
    sheet(`<h3>${esc(shortName(id))} entra por…</h3><div class="plist">${onF.map(x=>`<button class="prow" data-act="subOut" data-id="${x}">${avatar(x)}<span class="meta"><span class="nm">${esc(shortName(x))}</span></span></button>`).join("")}</div><button class="btn wide" data-act="close">Cancelar</button>`);return;
  }
  if(t==="amarilla"){
    const prev=st.st[id]?.am||0;addEvent({tipo:"amarilla",jugador:id,minuto,periodo});
    if(prev>=1){addEvent({tipo:"roja",jugador:id,minuto,periodo,detalle:"Doble amarilla"});toast("Segunda amarilla: expulsión registrada.")}
    closeSheet();return;
  }
  if(t==="roja"){pending={id,minuto,periodo};sheet(`<h3>Roja a ${esc(shortName(id))}</h3><div class="acts"><button class="btn dan" data-act="redType" data-v="Roja directa">Roja directa</button><button class="btn" data-act="redType" data-v="Doble amarilla">Doble amarilla</button></div><button class="btn wide" data-act="close">Cancelar</button>`);return}
  if(t==="lesion"){
    pending={id,minuto,periodo};const zonas=S.roster?.zonas||ZONAS_DEFAULT;
    sheet(`<h3>Zona de la lesión</h3><div class="acts">${zonas.map(z=>`<button class="btn" data-act="injZone" data-v="${esc(z)}">${esc(z)}</button>`).join("")}</div><button class="btn wide" data-act="close">Cancelar</button>`);return;
  }
  if(t==="penal_atajado"){addEvent({tipo:"penal_atajado",jugador:id,minuto,periodo});closeSheet();return}
  if(t==="nota"){pending={id,minuto,periodo};noteSheet(`Nota sobre ${shortName(id)}`);return}
}
function noteSheet(title){sheet(`<h3>${esc(title)}</h3><label class="f">Texto<textarea id="noteTxt" maxlength="300"></textarea></label><div class="row"><button class="btn pri" style="flex:1" data-act="saveNote">Guardar nota</button><button class="btn" data-act="close">Cancelar</button></div>`);setTimeout(()=>$("#noteTxt")?.focus(),50)}

/* ============ Vista: Cierre (DT) ============ */

  <section class="sec"><h2>Notas del partido</h2><label class="f">Observaciones (van a la hoja Partidos)<textarea id="notasM" data-inp="notasM" maxlength="500">${esc(m.notas||"")}</textarea></label></section>
  <section class="sec"><h2>Resumen por jugador</h2><div class="tbl"><table><thead><tr><th>#</th><th>Jugador</th><th>Cond.</th><th>Ent.</th><th>Sal.</th><th>Min</th><th>G</th><th>A</th><th>TA</th><th>TR</th></tr></thead><tbody>
   ${fs.rows.map(r=>`<tr><td class="num">${esc(player(r.id)?.dorsal||"")}</td><td>${esc(shortName(r.id))}</td><td>${r.cond==="Convocado sin jugar"?"No jugó":esc(r.cond)}</td><td class="num">${r.entra}</td><td class="num">${r.sale}</td><td class="num">${r.mins}</td><td class="num">${r.goles||""}</td><td class="num">${r.asist||""}</td><td class="num">${r.am||""}</td><td class="num">${r.ro||""}</td></tr>`).join("")}
   </tbody></table></div><p class="hint">El RPE se completa en la hoja, como siempre.</p></section>

  <section class="sec"><h2>Informe para WhatsApp</h2><p class="hint">Imagen con marcador, goleadores, tarjetas y jugador del partido.</p><button class="btn sky wide" data-act="report">Generar imagen</button><div id="repPrev"></div></section>`;

    <label class="f">Temperatura (°C)<input id="m_temp" data-inp="m_temp" inputmode="numeric" value="${esc(m.temp??"")}"></label></div>
    <div class="kv"><span>Estado del partido</span><strong>${esc(estadoTxt(m))}</strong></div><button class="btn sm" data-act="estadoSheet">Cambiar estado</button></section>`;
  html+=`<section class="sec"><h2>Sincronizar con la hoja</h2>
   ${!m.reloj?.fin2?'<div class="banner warn">El partido aún no ha terminado. Puedes sincronizar, pero lo normal es hacerlo tras el final.</div>':""}
   <ul class="steps">${steps.map(([k,l])=>`<li><span>${l}</span><span>${sync[k]?"✓ "+esc(sync[k]):"Pendiente"}</span></li>`).join("")}</ul>
   ${S.syncLog.length?`<div class="banner ${S.syncLog.some(x=>x.err)?"err":"ok"}">${S.syncLog.map(x=>esc(x.t)).join("<br>")}</div>`:""}

    :`<button class="btn pri wide" data-act="syncAsk" ${S.queue.length?"disabled":""}>Sincronizar</button>${S.queue.length?'<p class="hint">Espera a que se envíen los eventos pendientes.</p>':""}`)}
  </section>`;
  return html;
}

async function doSync(){
  const m=S.match;const fs=finalStats();const sync=Object.assign({},m.sync||{});
  S.syncing=true;S.syncLog=[];render();
  const log=(t,err)=>{S.syncLog.push({t,err});render()};
  const stamp=()=>{const d=new Date();return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+" "+pad2(d.getHours())+":"+pad2(d.getMinutes())};
  const [y,mo,da]=(m.fecha||todayStr()).split("-");
  const dateF=`=DATE(${Number(y)};${Number(mo)};${Number(da)})`;
  const nextRow=async col=>{const v=await readRange(col);let n=v.length;while(n>0&&(!v[n-1]||!v[n-1][0]))n--;return n+1};
  try{
    // 1. Partidos
    let ptId=m.ptId, row=m.sheetRow;
    if(!sync.partidos){
      if(row){
        await gs("update_values",{range:`Partidos!G${row}:H${row}`,values:[[fs.gf,fs.gc]]});
        await gs("update_values",{range:`Partidos!L${row}:M${row}`,values:[[[(m.estadoPartido&&m.estadoPartido.estado!=="Finalizado")?estadoTxt(m)+".":"",m.notas||""].filter(Boolean).join(" "),endMin()]]});
      }else{
        row=await nextRow("Partidos!B1:B200");ptId="PT"+pad2(row-1);
        await gs("update_values",{range:`Partidos!B${row}:H${row}`,values:[[dateF,m.competicion,m.rival,m.localia==="Neutral"?"Visitante":m.localia,m.micro===""?"":Number(m.micro)||m.micro,fs.gf,fs.gc]]});
        await gs("update_values",{range:`Partidos!L${row}:M${row}`,values:[[(m.localia==="Neutral"?"Cancha neutral. ":"")+((m.estadoPartido&&m.estadoPartido.estado!=="Finalizado")?estadoTxt(m)+". ":"")+(m.notas||""),endMin()]]});
      }
      sync.partidos=stamp();await setMatch({ptId,sheetRow:row,sync});log("Partidos: "+ptId+" con "+fs.gf+"-"+fs.gc);
    }
    ptId=S.match.ptId;
    const label=`${ptId} · ${da}/${mo} vs ${m.rival}`;
    const lab=id=>{const p=player(id);return p?id+" · "+p.nombre:id};
    // duplicate guard
    const existing=await readRange("Stats_Partido!B1:B1500");
    const dup=existing.filter(r=>r&&r[0]===ptId).length;
    // 2. Stats
    if(!sync.stats){
      if(dup&&!S.forceDup){S.syncing=false;S.confirmSync=false;log(`Stats_Partido ya tiene ${dup} filas de ${ptId}. No se escribió nada más para evitar duplicados. Revisa la hoja.`,true);return}
      const r0=await nextRow("Stats_Partido!A1:A1500");
      const vals=fs.rows.map(r=>[label,null,null,null,lab(r.id),null,r.cond,r.entra,r.sale,null,r.goles,r.asist,r.am,r.ro,m.mvp===r.id?"Sí":"",(cierre().notas[r.id]||null),null,null,(player(r.id)?.pos1==="Portero"||r.gr)?r.gr:null,r.pen||null,r.obs]);
      await gs("update_values",{range:`Stats_Partido!A${r0}:U${r0+vals.length-1}`,values:vals});
      sync.stats=stamp();await setMatch({sync});log("Stats_Partido: "+vals.length+" jugadores");
    }
    // 3. Eventos
    const st=computeState(activeEvents());
    if(!sync.eventos){
      const tl=st.timeline;
      if(tl.length){
        const r0=await nextRow("Eventos!A1:A3000");
        const vals=tl.map((x,i)=>{const e=x.e;let det=e.detalle||"";if(e.tipo==="formacion")det=e.formacion||det;if(e.tipo==="amon_ct")det=(e.color==="roja"?"Roja · ":"Amarilla · ")+det;
          return ["'"+ptId+"-"+pad2(i+1),"'"+ptId,e.periodo===2?"2T":"1T",e.minuto,TIPO_TXT[e.tipo]||e.tipo,e.jugador?lab(e.jugador):"",null,e.rel?lab(e.rel):"",det,x.gf,x.gc,e.autor===S.uid?"DT":"Asistente","'"+new Date(e.ts).toLocaleString("es-CO")]});
        await gs("update_values",{range:`Eventos!A${r0}:M${r0+vals.length-1}`,values:vals});
      }
      sync.eventos=stamp();await setMatch({sync});log("Eventos: "+st.timeline.length+" registros");
    }
    // 4. Lesiones
    if(!sync.lesiones){
      const les=activeEvents().filter(e=>e.tipo==="lesion"&&e.jugador);
      if(les.length){const r0=await nextRow("Lesiones!A1:A200");
        await gs("update_values",{range:`Lesiones!A${r0}:K${r0+les.length-1}`,values:les.map(e=>[lab(e.jugador),null,dateF,e.detalle||"","Lesión en partido (min. "+e.minuto+")","Partido","","",null,null,"Registrada desde la app vs "+m.rival])})}
      sync.lesiones=stamp();await setMatch({sync});log("Lesiones: "+les.length);
    }
    // 5. Sanciones
    if(!sync.sanciones){
      const rojas=activeEvents().filter(e=>e.tipo==="roja"&&e.jugador);
      if(rojas.length){const r0=await nextRow("Sanciones!A1:A200");
        await gs("update_values",{range:`Sanciones!A${r0}:J${r0+rojas.length-1}`,values:rojas.map(e=>[lab(e.jugador),null,dateF,label,e.detalle||"Roja directa","",null,null,null,"Expulsión en el min. "+e.minuto+". Sanción de la Liga pendiente."])})}
      sync.sanciones=stamp();await setMatch({sync});log("Sanciones: "+rojas.length);
    }
    // 6. Informe_Partido
    if(!sync.informe){
      const c=cierre();const r0=await nextRow("Informe_Partido!A1:A200");const local=m.localia!=="Visitante";const sf=S.match.staff||{};
      const F=k=>[(c.fases[k]||{}).n||"",(c.fases[k]||{}).obs||""];
      const dest=Object.entries(c.dest).filter(([k,v])=>v!=null).map(([k,v])=>dorsalPre(k)+(player(k)?.nombre||k)+(c.notas[k]?" ("+c.notas[k]+")":"")+(v?": "+v:"")).join("\n");
      let pf="";if(c.proxFecha){const [a,b,e]=c.proxFecha.split("-");pf=`=DATE(${+a};${+b};${+e})`}
      const row=["'"+ptId,dateF,m.competicion,m.jornada||"",m.hora||"",m.lugar||"",local?TEAM:m.rival,local?m.rival:TEAM,fs.gf,fs.gc,m.formacion||"",sf.dt||"",sf.asistentes||"",sf.pf||"",sf.porteros||"",sf.medico||"",sf.delegado||"",...F("of"),...F("tda"),...F("od"),...F("tad"),...F("bp"),dest,c.mantener||"",c.cambiar||"",c.proxRival||"",pf,m.clima||"",m.temp??"",(m.estadoPartido?.estado)||"Finalizado",(m.estadoPartido&&m.estadoPartido.estado!=="Finalizado")?estadoTxt(m):""];
      await gs("update_values",{range:`Informe_Partido!A${r0}:AJ${r0}`,values:[row]});
      sync.informe=stamp();await setMatch({sync});log("Informe_Partido: guardado");
    }
    log("Listo. Revisa el RPE en Stats_Partido.");
  }catch(e){log(gsErrorText(e),true)}
  finally{S.syncing=false;S.confirmSync=false;render()}
}

function cierreExtra(fs){

async function deleteMatch(mid){

    catch(e){toast("No se pudo borrar todo. Revisa la conexión e inténtalo de nuevo.");return false}
  }
  S.queue=S.queue.filter(q=>q.mid!==mid);saveQueue();
  if(S.mid===mid){S.estado={actual:null};try{await writeDoc("config/estado",S.estado)}catch(e){}subscribeMatch(null)}

  return `<section class="sec"><h2>Galería</h2><p class="hint">Foto del equipo presente en el partido, como evidencia. Aparece en el Informe.</p>
   ${g.length?`<div class="gal">${g.map(a=>`<figure><img src="${blobUrl(a)}" alt="Foto del equipo">${S.assets?`<button class="btn sm del" data-act="delGal" data-id="${esc(a)}">Quitar</button>`:""}</figure>`).join("")}</div>`:'<p class="hint">Aún no hay fotos de este partido.</p>'}
   ${S.assets?`<button class="btn sky wide" data-act="pick" data-for="galIn">Subir foto del equipo</button><input type="file" id="galIn" class="vh" accept="image/*" multiple>`:""}</section>`;
}
function shrinkMax(file,M){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{const s=Math.min(1,M/Math.max(i.width,i.height));const c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85)};i.onerror=rej;i.src=u})}
async function uploadGaleria(files){
  if(!S.assets||!S.match){toast("Activa un partido para subir fotos.");return}
  toast("Subiendo "+files.length+" foto(s)…");const ids=[];
  for(const f of files){try{const b=await shrinkMax(f,1200);const r=await S.assets.upload(b,{type:"image/jpeg"});ids.push(r.id)}catch(e){}}
  if(ids.length){await setMatch({galeria:[...(S.match.galeria||[]),...ids]});toast(ids.length+" foto(s) en la galería.")}else toast("No se pudo subir la foto.");
}
async function uploadMarca(kind,file){
  if(!S.assets)return;
  try{const blob=kind==="logo"?await shrinkContain(file,320):await shrink(file);const r=await S.assets.upload(blob,{type:kind==="logo"?"image/png":"image/jpeg"});S.marca=Object.assign({},S.marca,{[kind]:r.id});cacheLocal();try{await writeDoc("config/marca",S.marca)}catch(e){}render();toast(kind==="logo"?"Escudo guardado.":"Foto guardada.")}
  catch(e){toast("No se pudo subir la imagen.")}
}
function shrinkContain(file,S0){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=S0;c.height=S0;const g=c.getContext("2d");const s=Math.min(S0/i.width,S0/i.height);g.drawImage(i,(S0-i.width*s)/2,(S0-i.height*s)/2,i.width*s,i.height*s);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/png")};i.onerror=rej;i.src=u})}
async function uploadFotos(files){
  if(!S.assets){toast("Esta vista no permite subir imágenes.");return}let ok=0,bad=[];toast("Subiendo "+files.length+" foto(s)…");
  for(const f of files){
    const m=/(P\d{2})/i.exec(f.name);if(!m||!player(m[1].toUpperCase())){bad.push(f.name);continue}
    const id=m[1].toUpperCase();
    try{const blob=await shrink(f);const r=await S.assets.upload(blob,{type:"image/jpeg"});S.fotos[id]=r.id;ok++}catch(e){bad.push(f.name);S._upErr=(e&&(e.code||e.message))||"error"}
  }
  cacheLocal();try{await writeDoc("config/fotos",{map:S.fotos})}catch(e){}
  render();toast(`${ok} foto(s) guardada(s)`+(bad.length?` · sin asignar: ${bad.slice(0,3).join(", ")}`:"")+(S._upErr?` (${S._upErr})`:""));S._upErr=null;
}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{const W=300,H=400;const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");const s=Math.max(W/i.width,H/i.height);g.drawImage(i,(W-i.width*s)/2,(H-i.height*s)/2,i.width*s,i.height*s);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85)};i.onerror=rej;i.src=u})}

document.addEventListener("input",ev=>{
  const k=ev.target.dataset?.inp;if(!k)return;const v=ev.target.value;
  if(k==="notasM"){S._typing=Date.now();S.match.notas=v;clearTimeout(S._nt);S._nt=setTimeout(()=>setMatch({notas:v}),700);return}
  if((k==="m_clima"||k==="m_temp")&&S.match){S._typing=Date.now();const f=k==="m_clima"?"clima":"temp";const val=f==="temp"?(v===""?"":Number(v)||v):v;S.match[f]=val;clearTimeout(S._mt);S._mt=setTimeout(()=>setMatch({[f]:val}),600);return}
  if(k.startsWith("c_")&&S.match){const c=cierre();const t=ev.target;
    if(k==="c_fobs"){(c.fases[t.dataset.k]=c.fases[t.dataset.k]||{}).obs=v}
    else if(k==="c_nota"){const n=parseInt(v,10);c.notas[t.dataset.id]=n>0?n:null;saveCierre(true);return}
    else if(k==="c_dest"){c.dest[t.dataset.id]=v}
    else if(k==="c_txt"){c[t.dataset.k]=v}
    saveCierre();return}
  const d=S.draft;if(!d)return;
  if(k.startsWith("st_")){d.staff=d.staff||defaultStaff();d.staff[k.slice(3)]=v;saveDraft();return}
  if(k==="pickSheet"){const m=S.sheetMatches.find(x=>String(x.row)===v);if(m){Object.assign(d,{row:m.row,ptId:m.ptId,fecha:isoFromDmy(m.fecha),comp:m.comp,rival:m.rival,loc:m.loc||"Local",micro:m.micro||"",dur:Number(m.dur)||80,cupo:cupoFor(m.comp),maxCambios:reglasFor(m.comp).max,reingreso:reglasFor(m.comp).re})}else{d.row=null;d.ptId=null}saveDraft();render();return}
  if(k==="comp"){d.comp=v;d.cupo=cupoFor(v);const rg=reglasFor(v);d.maxCambios=rg.max;d.reingreso=rg.re;saveDraft();render();return}
  if(k==="maxCambios"){const n=parseInt(v,10);d.maxCambios=n>0?n:null;saveDraft();return}
  if(k==="reingreso"){d.reingreso=v==="si";saveDraft();return}
  if(k==="formacion"){const n=formsAll()[v].length;d.formacion=v;d.coords=null;d.slots=d.slots.slice(0,n);while(d.slots.length<n)d.slots.push(null);saveDraft();render();return}
  if(k==="cupo"){const n=parseInt(v,10);d.cupo=n>0?n:null;saveDraft();renderPartidoCount();return}
  d[k]=v;saveDraft();
});
document.addEventListener("change",ev=>{if(ev.target.id==="fotosIn"&&ev.target.files?.length)uploadFotos([...ev.target.files]);if(ev.target.id==="galIn"&&ev.target.files?.length)uploadGaleria([...ev.target.files]);if((ev.target.id==="logoIn"||ev.target.id==="dtIn")&&ev.target.files?.length)uploadMarca(ev.target.id==="logoIn"?"logo":"dt",ev.target.files[0])});
function renderPartidoCount(){/* evita perder el foco del campo de cupo */}

let wake=null;
async function keepAwake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.match?.reloj?.inicio1&&!S.match?.reloj?.fin2)keepAwake()});

/* ============ Reloj en pantalla ============ */
setInterval(()=>{if(!S.match)return;const t=clockText();document.querySelectorAll("[data-clock]").forEach(e=>{if(e.textContent!==t)e.textContent=t});const ck=document.querySelector(".clock");const c0=clockState();if(ck)ck.classList.toggle("over",!!c0.over);if(c0.over){const k="v"+c0.per+S.mid;if(S._vib!==k){S._vib=k;buzz([200,100,200])}}
  const l=document.querySelector("[data-clocklabel]");if(l){const c=clockState();const s=c.label+" · "+(S.match.duracion||80)+"'";if(l.textContent!==s)l.textContent=s}},1000);

/* ============ Arranque ============ */
applyTheme();
loadLocal();
S.view=S.mid?"vivo":"partido";
render();
(async function boot(){
  const C=window.claude;
  const [db,user,assets,mcp,dl]=await Promise.all(["db","user","assets","mcp","downloads"].map(n=>C&&C.use?C.use(n).catch(()=>null):Promise.resolve(null)));
  Object.assign(S,{db,user,assets,mcp,dl});
  if(user){try{S.isOwner=await user.isOwner();S.uid=await user.id()}catch(e){}}
  else S.isOwner=true; // sin plataforma: modo local de un solo teléfono
  if(!S.isOwner&&S.view!=="vivo")S.view="vivo";
  if(db){
    db.doc("config/plantilla").onSnapshot(s=>{if(s.exists){S.roster=cl(s.data());cacheLocal();render()}},()=>{});
    db.doc("config/fotos").onSnapshot(s=>{if(s.exists){S.fotos=cl(s.data()).map||{};cacheLocal();render()}},()=>{});
    db.collection("partidos").onSnapshot(q=>{S.allMatches=q.docs.map(d=>Object.assign({_id:d.id},cl(d.data())));if(S.view==="ajustes")render()},()=>{});
    db.doc("config/marca").onSnapshot(s=>{if(s.exists){S.marca=cl(s.data());cacheLocal();render()}},()=>{});
    db.doc("config/hoja").onSnapshot(s=>{if(s.exists){S.hoja=cl(s.data());cacheLocal();renderBoard()}},()=>{});
    db.doc("config/usuarios").onSnapshot(s=>{if(s.exists){S.usuarios=cl(s.data());if(S.view==="ajustes")render()}},()=>{});
    db.doc("config/staff").onSnapshot(s=>{if(s.exists){S.staff=cl(s.data());cacheLocal()}},()=>{});
    db.doc("config/formaciones").onSnapshot(s=>{if(s.exists){S.forms=cl(s.data()).map||{};cacheLocal()}},()=>{});
    db.doc("config/estado").onSnapshot(s=>{if(!s.exists){if(S.mid&&!unsub.match)subscribeMatch(S.mid);return}const a=cl(s.data()).actual||null;S.estado={actual:a};if(a!==S.mid)subscribeMatch(a);else render()},()=>{});
    flushQueue();
  }
  render();
})();
