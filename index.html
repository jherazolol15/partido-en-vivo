<!-- v4.16 · Etapa 7: esta app se retiró. Lleva a SIGE Jaguares conservando los enlaces de familias (#p=), padres (#ver=) y asistente (#inv=). -->
<script>
(function () {
  var h = location.hash || "", keep = /^#(p|ver|inv)=/.test(h) || /^#\/bienestar$/.test(h) ? h : "";
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (r.scope.indexOf("/sige-jaguares/") < 0) r.unregister(); }); }); } catch (e) {}
  try { if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (!/^sige4/.test(k)) caches.delete(k); }); }); } catch (e) {}
  setTimeout(function () { location.replace("/sige-jaguares/" + keep); }, 150);
})();
</script></head>
